name: bead_studio
description: 豆田 - 图片导入/像素化/调色板量化/画布编辑/用料统计
publish_to: "none"
version: 0.2.0

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  # 图像解码/编码/缩放（自带量化所需基础能力）
  google_mlkit_text_recognition: ^0.17.1
  image: ^4.2.0
  # 相册/拍照选图
  image_picker: ^1.1.2
  # 小红书链接导入（笔记页解析 + 原图下载）
  http: ^1.2.0
  # 本地草稿目录
  path_provider: ^2.1.4
  # 抖音无损原图通道：隐藏 WebView 加载 PC 笔记页，从 hydrate DOM
  # 提取 q75.jpeg 签名 URL（=作者原图字节；见 docs/douyin_lossless_channel.md）
  webview_flutter: ^4.14.1
  file_picker: ^13.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true

  # 内置色卡数据（MARD 220 色，scripts/gen_mard_palette.py 生成）
  assets:
    - assets/palettes/

  # 中文本地字体：引擎默认从 fonts.gstatic.com 拉 Noto Sans SC 分片（被墙则文字
  # 布局阻塞重试、首帧画不出），打包为应用字体后彻底摆脱网络依赖
  fonts:
    - family: NotoSansSC
      fonts:
        - asset: assets/fonts/NotoSansSC-Regular.otf
        - asset: assets/fonts/NotoSansSC-Bold.otf
          weight: 700
