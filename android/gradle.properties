# 16GB 内存机器：模板默认 -Xmx8G/4G Metaspace 会原生 OOM 崩溃（G1 mmap 失败）。
# 系统提交内存紧张（微信/QQ/VSCode 常驻），进一步压缩：2G 堆 + Kotlin 编译 in-process
# （省掉独立 Kotlin daemon 整个 JVM）+ 关并行，总占用控制在 ~2.5G 内。
org.gradle.jvmargs=-Xmx2G -XX:MaxMetaspaceSize=1G -XX:ReservedCodeCacheSize=384m -XX:+HeapDumpOnOutOfMemoryError
kotlin.compiler.execution.strategy=in-process
# 关 Kotlin 增量编译：内存/磁盘中断下增量缓存易损坏（Could not close incremental caches）
kotlin.incremental=false
org.gradle.workers.max=2
org.gradle.parallel=false
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
